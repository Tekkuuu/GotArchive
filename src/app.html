<!doctype html>
<html lang="en" dir="ltr" data-theme="gotlight">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  %sveltekit.head%

  <script>
    // Theme handler
    (function () {
      var darkMode = localStorage.getItem('darkMode') === 'true';
      if(darkMode) {
        document.documentElement.setAttribute('data-theme', 'gotdark')
        );
      } else {
        document.documentElement.setAttribute('data-theme', 'gotlight')
      }
    })();
  </script>
</head>

<body data-sveltekit-preload-data="hover" class="bg-base-200 flex flex-col min-h-screen">
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
