version: '3.8'

services:
  # PostgreSQL Database for development
  postgres:
    image: postgres:17-alpine
    container_name: gotarchive-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: gotarchive
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - '5775:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gotarchive-network

  # Uptime Kuma for development
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: gotarchive-uptime-kuma-dev
    restart: unless-stopped
    volumes:
      - uptime_kuma_dev_data:/app/data
    ports:
      - '3001:3001'
    networks:
      - gotarchive-network

networks:
  gotarchive-network:
    driver: bridge

volumes:
  postgres_dev_data:
  uptime_kuma_dev_data:
