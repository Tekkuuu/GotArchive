<!doctype html>
<html lang="en" dir="ltr" data-theme="gotdark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%

		<script>
			(function () {
				var darkMode = localStorage.getItem('darkMode') === 'true';
				if (darkMode) {
					document.documentElement.setAttribute('data-theme', 'gotdark');
				} else {
					document.documentElement.setAttribute('data-theme', 'gotlight');
				}
			})();
		</script>
	</head>

	<body data-sveltekit-preload-data="hover" class="bg-base-100 flex min-h-screen flex-col">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
