version: '3.8'

services:
  # PostgreSQL Database for development
  postgres:
    image: postgres:17-alpine
    container_name: gotarchive-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: gotarchive,logwell
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/create-multiple-databases.sh:/docker-entrypoint-initdb.d/create-multiple-databases.sh
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gotarchive-network

  # Uptime Kuma for development
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: gotarchive-uptime-kuma-dev
    restart: unless-stopped
    volumes:
      - uptime_kuma_dev_data:/app/data
    ports:
      - '3001:3001'
    networks:
      - gotarchive-network

  # Redis for development
  redis:
    image: redis:7-alpine
    container_name: gotarchive-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gotarchive-network

  # Logwell (self-hosted logging platform)
  logwell:
    image: ghcr.io/divkix/logwell:latest
    container_name: gotarchive-logwell-dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5433/logwell
      BETTER_AUTH_SECRET: qcR6nOTQC+g+XsUEGpQVpv2iDSAlCyOQB/oaOc+a3ns=
      BETTER_AUTH_BASE_URL: http://localhost:5174
      ADMIN_PASSWORD: Admin123!
      ORIGIN: http://localhost:5174
      NODE_ENV: development
    ports:
      - '5174:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gotarchive-network
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

networks:
  gotarchive-network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
  uptime_kuma_dev_data:
